<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manajemen Seserahan</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #f5f7fb;
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }

      .header h1 {
        font-size: 28px;
        color: #1f2937;
      }

      .header p {
        color: #6b7280;
        margin-top: 5px;
      }

      .btn-add {
        border: none;
        background: #2563eb;
        color: white;
        padding: 12px 18px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 15px;
        margin-bottom: 25px;
      }

      .card {
        background: white;
        padding: 20px;
        border-radius: 18px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
      }

      .card i {
        font-size: 22px;
        color: #2563eb;
        margin-bottom: 10px;
      }

      .card h3 {
        font-size: 24px;
        margin-bottom: 5px;
      }

      .card span {
        color: #6b7280;
      }

      .success i {
        color: #16a34a;
      }

      .warning i {
        color: #f59e0b;
      }

      .primary i {
        color: #2563eb;
      }

      .category-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 18px;
      }

      .category-card {
        background: white;
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
      }

      .category-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .category-header h3 {
        font-size: 18px;
        margin-bottom: 4px;
      }

      .category-header span {
        color: #6b7280;
        font-size: 13px;
      }
      .category-header h3 i {
        margin-right: 8px;
        color: #2563eb;
        width: 20px;
      }

      .progress-badge {
        background: #eff6ff;
        color: #2563eb !important;
        padding: 6px 12px;
        border-radius: 999px;
        font-weight: 600;
      }

      .item-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f9fafb;
        padding: 12px;
        border-radius: 12px;
      }

      .item h4 {
        font-size: 14px;
        margin-bottom: 3px;
      }

      .item small {
        color: #6b7280;
      }

      .item i {
        color: #9ca3af;
      }

      .item.completed i {
        color: #16a34a;
      }

      .skeleton {
        background: linear-gradient(
          90deg,
          #f1f5f9 25%,
          #e2e8f0 50%,
          #f1f5f9 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .skeleton-card {
        height: 110px;
        border-radius: 18px;
      }

      .skeleton-category {
        height: 250px;
        border-radius: 18px;
        margin-bottom: 16px;
      }

      @media (max-width: 768px) {
        body {
          padding: 12px;
        }

        .header {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
        }

        .btn-add {
          position: fixed;
          bottom: 20px;
          right: 20px;
          width: 60px;
          height: 60px;
          border-radius: 50%;
          padding: 0;
          font-size: 20px;
        }

        .btn-add {
          color: white;
        }

        .btn-add::after {
          content: "";
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div>
          <h1>🎁 Manajemen Seserahan</h1>
          <p>Pantau progres persiapan seserahan</p>
        </div>

        <button class="btn-add">
          <i class="fas fa-plus"></i>
          Tambah Item
        </button>
      </div>

      <!-- Statistik -->
      <div class="stats" id="summaryContainer">
        <div class="card skeleton skeleton-card">
          <i class="fas fa-box"></i>
          <h3 id="totalItem">0</h3>
          <span>Total Item</span>
        </div>

        <div class="card skeleton skeleton-card success">
          <i class="fas fa-check-circle"></i>
          <h3 id="totalCompleted">0</h3>
          <span>Sudah Dibeli</span>
        </div>

        <div class="card skeleton skeleton-card warning">
          <i class="fas fa-clock"></i>
          <h3 id="totalPending">0</h3>
          <span>Belum Dibeli</span>
        </div>

        <div class="card skeleton skeleton-card primary">
          <i class="fas fa-wallet"></i>
          <h3 id="totalBudget">Rp0</h3>
          <span>Total Budget</span>
        </div>
      </div>

      <!-- Kategori -->
      <div id="dashboard" class="category-list">
        <div class="category-card skeleton skeleton-category"></div>
      </div>
    </div>

    <script>
      loadData();

      function loadData() {
        fetch(
          "https://script.google.com/macros/s/AKfycbw077XQVpvfFv9nr8A-pf7gHpSjfA_Xj9i8yOs28MFa2eq8uIeknkpBc4QKbmKouwWYIQ/exec?action=seserahan",
        )
          .then((ress) => ress.json())
          .then((result) => {
            const status = result.status;
            const code = result.code;

            if (status != "success" || code != 200) {
              alert("Data tidak ditemukan!");
              return;
            }

            renderSummary(result.data);
            renderDashboard(result.data.categories);
          });
      }

      function renderDashboard(categories) {
        let html = "";

        categories.forEach((category) => {
          html += `
        <div class="category-card">

            <div class="category-header">
                <div>
                    <h3>
                      ${getCategoryIcon(category.category_id)}
                      ${category.category_name}
                    </h3>
                    <span>
                     ${category.total_item} Item •
                      Rp ${Number(category.budget).toLocaleString("id-ID")}
                      </span>
                </div>

                <span class="progress-badge">
                    ${category.completed}/${category.total_item}
                </span>
            </div>

            <div class="item-list">
        `;

          category.items.forEach((item) => {
            html += `
            <div class="item ${item.status == 1 ? "completed" : ""}">

                <div>

                    <h4>${item.name}</h4>

                    <small>

                       ${
                         item.weight
                           ? item.weight + " gram"
                           : item.qty + " " + item.unit
                       }
                        • Rp ${Number(item.price).toLocaleString("id-ID")}

                    </small>

                </div>

                <i class="fas ${
                  item.status == 1 ? "fa-check-circle" : "fa-circle"
                }"></i>

            </div>
            `;
          });

          html += `
            </div>
        </div>
        `;
        });

        document.getElementById("dashboard").innerHTML = html;
      }

      function renderSummary(data) {
        document.getElementById("totalItem").innerText = data.total_item;

        document.getElementById("totalCompleted").innerText =
          data.total_completed;

        document.getElementById("totalPending").innerText = data.total_pending;

        document.getElementById("totalBudget").innerText =
          "Rp " + Number(data.total_budget).toLocaleString("id-ID");

        document
          .querySelectorAll("#summaryContainer .card")
          .forEach((x) => x.classList.remove("skeleton", "skeleton-card"));
      }

      function getCategoryIcon(categoryId) {
        const icons = {
          1: "🕌", // Ibadah
          2: "💍", // Perhiasan
          3: "💄", // Make Up
          4: "✨", // Skincare
          5: "👜", // Aksesoris
          6: "🧴", // Bodycare
          7: "🪥", // Toiletries
          8: "👗", // Pakaian
          9: "🩷", // Pakaian Dalam
        };

        return icons[categoryId] || "🎁";
      }

      // document.getElementById("summaryContainer").innerHTML = `
      //   <div class="card skeleton skeleton-card"></div>
      //   <div class="card skeleton skeleton-card"></div>
      //   <div class="card skeleton skeleton-card"></div>
      //   <div class="card skeleton skeleton-card"></div>
      // `;

      // document.getElementById("dashboard").innerHTML = `
      //   <div class="category-card skeleton skeleton-category"></div>
      //   <div class="category-card skeleton skeleton-category"></div>
      //   <div class="category-card skeleton skeleton-category"></div>
      //   <div class="category-card skeleton skeleton-category"></div>
      // `;
    </script>
  </body>
</html>
