<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Date</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      body {
        background: #f4f6f9;
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: auto;
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header-left h2 {
        margin: 0;
      }

      .add-btn {
        border: none;
        background: #2563eb;
        color: white;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }

      .add-btn:hover {
        background: #1d4ed8;
      }
      .add-btn .btn-text {
        display: inline;
      }

      h2 {
        margin-bottom: 20px;
        color: #1f2937;
      }

      .table-container {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 10px;
      }

      thead {
        background: #2563eb;
        color: white;
      }

      th {
        padding: 10px 20px;
      }
      td {
        padding: 0px 20px;
      }

      th {
        text-align: center;
        vertical-align: middle;
      }

      td {
        vertical-align: middle;
      }

      th:nth-child(1) {
        text-align: left;
      }

      td:nth-child(1),
      td:nth-child(4) {
        text-align: left;
      }

      td:nth-child(2),
      td:nth-child(3),
      td:nth-child(5) {
        text-align: center;
      }
      th:nth-child(2),
      td:nth-child(2) {
        width: 120px;
      }

      th:nth-child(3),
      td:nth-child(3) {
        width: 140px;
      }

      th:nth-child(5),
      td:nth-child(5) {
        width: 120px;
      }

      th:nth-child(4),
      td:nth-child(4) {
        width: 150px;
        max-width: 150px;
      }

      tbody tr:hover {
        background: #f8fafc;
      }

      .badge {
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }

      .badge-success {
        background: #dcfce7;
        color: #166534;
      }

      .badge-warning {
        background: #fef3c7;
        color: #92400e;
      }

      .action-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }

      .icon-btn:hover {
        transform: translateY(-2px);
      }

      .icon-edit {
        background: #fff7ed;
        color: #f97316;
      }

      .icon-delete {
        background: #fef2f2;
        color: #dc2626;
      }

      .icon-date {
        background: #eff6ff;
        color: #2563eb;
      }

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      .modal-content {
        width: 90%;
        max-width: 450px;
        background: white;
        padding: 24px;
        border-radius: 18px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 6px;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 14px;
      }

      .form-group textarea {
        resize: none;
        min-height: 80px;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }

      .checkbox-group input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin: 0;
      }

      .checkbox-group label {
        margin: 0;
        font-weight: 500;
      }

      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }

      .btn-save {
        background: #2563eb;
        color: white;
      }

      .btn-save:hover {
        background: #1d4ed8;
      }

      .btn-cancel {
        background: #f3f4f6;
        color: #374151;
      }

      .btn-cancel:hover {
        background: #e5e7eb;
      }

      .loading-box {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 220px;
        height: 160px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        z-index: 99999;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .spinner {
        width: 45px;
        height: 45px;
        border: 4px solid #e5e7eb;
        border-top: 4px solid #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loading-box p {
        margin-top: 12px;
        font-size: 14px;
        color: #374151;
        font-weight: 500;
      }

      .page-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .back-btn {
        width: 40px;
        height: 40px;

        display: flex;
        align-items: center;
        justify-content: center;

        border: none;
        border-radius: 10px;

        background: #eff6ff;
        color: #2563eb;

        text-decoration: none;
        flex-shrink: 0;
      }

      .back-btn:hover {
        background: #dbeafe;
      }

      .action-menu {
        position: relative;
        display: inline-block;
      }

      .menu-btn {
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 18px;
        color: #6b7280;
      }

      .dropdown-menu {
        display: none;
        position: absolute;
        right: 0;
        top: 42px;
        background: #fff;
        min-width: 180px;
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        padding: 8px;
        z-index: 999;
      }

      .dropdown-menu.show {
        display: block;
      }

      .dropdown-menu button {
        width: 100%;
        border: none;
        background: transparent;
        padding: 5px;
        border-radius: 12px;
        text-align: left;
        cursor: pointer;

        display: flex;
        align-items: center;
        gap: 12px;

        font-size: 14px;
        /* font-weight: 600; */
      }

      .dropdown-menu button:hover {
        background: #f8fafc;
      }

      .menu-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 15px;
      }

      .menu-date {
        background: #eff6ff;
        color: #2563eb;
      }

      .menu-edit {
        background: #fff7ed;
        color: #f97316;
      }

      .menu-delete {
        background: #fef2f2;
        color: #dc2626;
      }

      .desktop-actions {
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .mobile-actions {
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        body {
          padding: 10px;
        }

        .container {
          padding: 15px;
        }

        h2 {
          font-size: 20px;
        }

        table {
          font-size: 13px;
        }

        th,
        td {
          padding: 10px 8px;
        }

        .modal-content {
          width: 95%;
          padding: 18px;
        }

        .form-group input,
        .form-group textarea {
          font-size: 16px;
        }
        .desktop-actions {
          display: none;
        }

        .mobile-actions {
          display: block;
        }

        .add-btn {
          position: fixed;
          right: 20px;
          bottom: 20px;

          width: 56px;
          height: 56px;
          padding: 0;

          display: flex;
          align-items: center;
          justify-content: center;

          border-radius: 50%;
          z-index: 999;

          box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }

        .add-btn .btn-text {
          display: none;
        }

        .add-btn i {
          margin: 0;
          font-size: 20px;
          line-height: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="page-header">
        <div class="header-left">
          <a href="../" class="back-btn"><i class="fas fa-arrow-left"></i></a>

          <h2>Dancu</h2>
        </div>

        <button class="add-btn" onclick="openCreateModal()">
          <i class="fas fa-plus"></i>
          <span class="btn-text">Tambah Dancu</span>
        </button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Dancu</th>
              <th>Status</th>
              <th>Tanggal</th>
              <th>Note</th>
              <th>Aksi</th>
            </tr>
          </thead>

          <tbody id="tblData"></tbody>
        </table>
      </div>
    </div>

    <!-- Modal Tanggal -->
    <div id="dateModal" class="modal">
      <div class="modal-content">
        <h3>📅 Jadwalkan Kencan</h3>

        <input type="hidden" id="dateId" />

        <div class="form-group">
          <label>Tanggal Kencan</label>
          <input type="date" id="dateValue" />
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="dateDone" />
          <label for="dateDone"> Tandai sebagai terlaksana </label>
        </div>

        <div class="modal-footer">
          <button class="icon-btn icon-date" onclick="saveDate()">
            <i class="fas fa-save"></i>
          </button>

          <button class="icon-btn btn-cancel" onclick="closeDateModal()">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Edit -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <h3>✏️ Edit Kencan</h3>

        <input type="hidden" id="editId" />

        <div class="form-group">
          <label>Nama Kencan</label>
          <input type="text" id="editName" />
        </div>

        <div class="form-group">
          <label>Note</label>
          <input type="text" id="editNote" />
        </div>

        <div class="modal-footer">
          <button class="icon-btn icon-edit" onclick="saveEdit()">
            <i class="fas fa-save"></i>
          </button>

          <button class="icon-btn btn-cancel" onclick="closeEditModal()">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Hapus -->
    <div id="deleteModal" class="modal">
      <div class="modal-content">
        <h3>⚠️ Hapus Kencan</h3>

        <p id="deleteText"></p>

        <div class="modal-footer">
          <button class="icon-btn icon-delete" onclick="confirmDelete()">
            <i class="fas fa-trash"></i>
          </button>

          <button class="icon-btn btn-cancel" onclick="closeDeleteModal()">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Tambah -->
    <div id="createModal" class="modal">
      <div class="modal-content">
        <h3>➕ Tambah Kencan</h3>

        <div class="form-group">
          <label>Kencan</label>
          <input type="text" id="createName" required />
        </div>

        <div class="form-group">
          <label>Tanggal Kencan</label>
          <input type="date" id="createDate" required />
        </div>

        <div class="form-group">
          <label>Note</label>
          <input type="text" id="createNote" required />
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="createDone" />
          <label for="createDone"> Tandai sebagai terlaksana </label>
        </div>

        <div class="form-group">
          <label>Pembuat</label>
          <input id="createdBy" type="text" value="sayang" />
        </div>

        <div class="modal-footer">
          <button class="icon-btn icon-date" onclick="saveCreate()">
            <i class="fas fa-save"></i>
          </button>

          <button class="icon-btn btn-cancel" onclick="closeCreateModal()">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
    </div>

    <div id="loading" class="loading-box">
      <div class="spinner"></div>
      <p>Memuat data...</p>
    </div>
    <script>
      loadData();
      let allData = [];
      let deleteId = 0;
      function loadData() {
        showLoading();
        fetch(
          "https://script.google.com/macros/s/AKfycbw-GeE-k-wSTBJtI860LyeYRVJJIOB56yJNN4OLa46zWx8G4IS31vrXkY4DYYH6h_WLog/exec?action=list_date",
        )
          .then((response) => response.json())
          .then((result) => {
            hideLoading();
            if (result.status != "success" || result.code != 200) {
              alert("Data tidak ditemukan");
              return;
            }
            renderTable(result.data);
          })
          .catch((err) => {
            hideLoading();
            console.error(err);
            alert("Gagal mengambil data");
          });
      }

      function renderTable(data) {
        allData = data;

        let html = "";

        data.forEach((item) => {
          html += `
                    <tr>
                        <td>${item.name}</td>

                        <td class="status-column">
                            ${
                              item.is_done == "1"
                                ? '<span class="badge badge-success">Selesai</span>'
                                : '<span class="badge badge-warning">Belum</span>'
                            }
                        </td>

                        <td>
                            ${item.is_date || "-"}
                        </td>

                        <td>
                            ${item.note || "-"}
                        </td>

                        <td>
                            <div class="desktop-actions">
                                <button
                                class="icon-btn icon-date"
                                onclick="editData(${item.id})">
                                <i class="fas fa-calendar-days"></i>
                                </button>

                                <button
                                class="icon-btn icon-edit"
                                onclick="openEditModal(${item.id})">
                                <i class="fas fa-pen"></i>
                                </button>

                                <button
                                class="icon-btn icon-delete"
                                onclick="deleteData(${item.id})">
                                <i class="fas fa-trash"></i>
                                </button>

                            </div>


                            <div class="mobile-actions">

                                <div class="action-menu">

                                    <button
                                        class="menu-btn"
                                        onclick="toggleMenu(${item.id})">

                                        <i class="fas fa-ellipsis-vertical"></i>

                                    </button>

                                    <div class="dropdown-menu" id="menu-${item.id}">

                                        <button onclick="editData(${item.id})">
                                            <div class="menu-icon menu-date">
                                            <i class="fas fa-calendar-days"></i>
                                            </div>
                                            Atur Tanggal
                                        </button>

                                        <button onclick="openEditModal(${item.id})">
                                            <div class="menu-icon menu-edit">
                                            <i class="fas fa-pen"></i>
                                            </div>
                                            Edit
                                        </button>

                                        <button onclick="deleteData(${item.id})">
                                            <div class="menu-icon menu-delete">
                                            <i class="fas fa-trash"></i>
                                            </div>
                                            Hapus
                                        </button>
                                    </div>

                                </div>

                            </div>

                        </td>
                    </tr>
                    `;
        });

        document.getElementById("tblData").innerHTML = html;
      }

      function editData(id) {
        const item = allData.find((x) => x.id == id);

        document.getElementById("dateId").value = item.id;
        document.getElementById("dateValue").value = item.is_date || "";
        document.getElementById("dateDone").checked = item.is_done == "1";

        document.getElementById("dateModal").style.display = "flex";
      }

      function closeDateModal() {
        document.getElementById("dateModal").style.display = "none";
      }

      function saveDate() {
        showLoading("Menyimpan data..");
        const formData = new FormData();

        formData.append("action", "updateDate");
        formData.append("id", document.getElementById("dateId").value);

        const date = document.getElementById("dateValue").value;
        const isDone = document.getElementById("dateDone").checked ? "1" : "0";

        if (date) {
          formData.append("is_date", date);
        }

        formData.append("is_done", isDone);

        fetch(
          "https://script.google.com/macros/s/AKfycbw-GeE-k-wSTBJtI860LyeYRVJJIOB56yJNN4OLa46zWx8G4IS31vrXkY4DYYH6h_WLog/exec",
          {
            method: "POST",
            body: formData,
          },
        )
          .then((res) => res.json())
          .then((data) => {
            hideLoading();
            closeDateModal();
            if (data.status == "success" || data.code == 200) {
              alert("Data berhasil disimpan");
              loadData();
            } else {
              alert(data.message);
            }
          })
          .catch((err) => {
            hideLoading();
            console.error(err);
            alert("Gagal menyimpan data");
          });
      }

      function openEditModal(id) {
        const item = allData.find((x) => x.id == id);

        document.getElementById("editId").value = item.id;

        document.getElementById("editNote").value = item.note;
        document.getElementById("editName").value = item.name;

        document.getElementById("editModal").style.display = "flex";
      }

      function closeEditModal() {
        document.getElementById("editModal").style.display = "none";
      }

      function saveEdit() {
        showLoading("Menyimpan data..");
        const formData = new FormData();

        formData.append("action", "updateNameDate");
        formData.append("id", document.getElementById("editId").value);
        formData.append("name", document.getElementById("editName").value);
        formData.append("note", document.getElementById("editNote").value);

        fetch(
          "https://script.google.com/macros/s/AKfycbw-GeE-k-wSTBJtI860LyeYRVJJIOB56yJNN4OLa46zWx8G4IS31vrXkY4DYYH6h_WLog/exec",
          {
            method: "POST",
            body: formData,
          },
        )
          .then((res) => res.json())
          .then((data) => {
            hideLoading();
            closeEditModal();
            if (data.status == "success" || data.code == 200) {
              alert("Data berhasil disimpan");
              loadData();
            } else {
              alert(data.message);
            }
          })
          .catch((err) => {
            hideLoading();
            console.error(err);
            alert("Gagal menyimpan data");
          });
      }

      function deleteData(id) {
        const item = allData.find((x) => x.id == id);

        deleteId = id;

        document.getElementById("deleteText").innerHTML =
          `Yakin menghapus kencan <b>${item.name}</b>?`;

        document.getElementById("deleteModal").style.display = "flex";
      }

      function closeDeleteModal() {
        document.getElementById("deleteModal").style.display = "none";
      }

      function confirmDelete() {
        if (!deleteId) {
          alert("Data tidak ditemukan!");
          return;
        }

        console.log("id: ", deleteId);

        showLoading("Menghapus data..");

        const formData = new FormData();

        formData.append("action", "deleteDate");
        formData.append("id", deleteId);

        fetch(
          "https://script.google.com/macros/s/AKfycbw-GeE-k-wSTBJtI860LyeYRVJJIOB56yJNN4OLa46zWx8G4IS31vrXkY4DYYH6h_WLog/exec",
          {
            method: "POST",
            body: formData,
          },
        )
          .then((response) => response.json())
          .then((result) => {
            closeDeleteModal();
            hideLoading();
            if (result.status == "success" || result.code == 200) {
              alert(result.message);
            } else {
              alert(result.message);
            }
            loadData();
          })
          .catch((err) => {
            hideLoading();
            console.error(err);
            alert("Gagal menghapus data");
          });
      }

      function showLoading(text = "Memuat data...") {
        document.querySelector("#loading p").innerText = text;
        document.getElementById("loading").style.display = "flex";
      }

      function hideLoading() {
        document.getElementById("loading").style.display = "none";
      }

      function toggleMenu(id) {
        document.querySelectorAll(".dropdown-menu").forEach((menu) => {
          if (menu.id !== `menu-${id}`) {
            menu.classList.remove("show");
          }
        });

        document.getElementById(`menu-${id}`).classList.toggle("show");
      }

      document.addEventListener("click", function (e) {
        if (!e.target.closest(".action-menu")) {
          document
            .querySelectorAll(".dropdown-menu")
            .forEach((menu) => menu.classList.remove("show"));
        }
      });

      function openCreateModal() {
        document.getElementById("createName").value = "";
        document.getElementById("createDate").value = "";
        document.getElementById("createNote").value = "";
        document.getElementById("createDone").value;
        document.getElementById("createdBy").value = "sayang";

        document.getElementById("createModal").style.display = "flex";
      }

      function closeCreateModal() {
        document.getElementById("createModal").style.display = "none";
      }

      function saveCreate() {
        const name = document.getElementById("createName").value.trim();
        const date = document.getElementById("createDate").value;

        const note = document.getElementById("createNote").value;
        const status = document.getElementById("createDone").checked
          ? "1"
          : "0";
        const createdBy = document.getElementById("createdBy").value.trim();

        if (!name) {
          alert("Nama kencan wajib diisi");
          return;
        }

        // if (!date) {
        //   alert("Tanggal wajib diisi");
        //   return;
        // }

        showLoading("Menyimpan data..");

        const formData = new FormData();

        formData.append("action", "createDate");
        formData.append("name", name);
        formData.append("is_done", status);
        formData.append("is_date", date);
        formData.append("note", note);
        formData.append("created_by", createdBy);

        fetch(
          "https://script.google.com/macros/s/AKfycbw-GeE-k-wSTBJtI860LyeYRVJJIOB56yJNN4OLa46zWx8G4IS31vrXkY4DYYH6h_WLog/exec",
          {
            method: "POST",
            body: formData,
          },
        )
          .then((res) => res.json())
          .then((data) => {
            hideLoading();

            if (data.status == "success") {
              closeCreateModal();

              alert("Kencan berhasil ditambahkan");

              loadData();
            } else {
              alert(data.message);
            }
          })
          .catch((err) => {
            hideLoading();

            console.error(err);

            alert("Gagal menyimpan data");
          });
      }
    </script>
  </body>
</html>
