<!doctype html>
<html>
  <head>
    <title>Daftar Undangan</title>
  </head>
  <body>
    <h2>Daftar Undangan</h2>

    <label>Category</label>
    <select id="categoryFilter">
      <option value="">Semua</option>
    </select>

    <br /><br />
    <a href="../">
      <button type="button">Input list undangan</button>
    </a>

    <br /><br />

    <table border="1">
      <thead>
        <tr>
          <th>Nama</th>
          <th>Category</th>
          <th>No. Wa</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tblData"></tbody>
    </table>

    <script>
      let allData = [];

      let currentData = [];

      fetch(
        "https://script.google.com/macros/s/AKfycbw077XQVpvfFv9nr8A-pf7gHpSjfA_Xj9i8yOs28MFa2eq8uIeknkpBc4QKbmKouwWYIQ/exec?action=name",
      )
        .then((res) => res.json())
        .then((data) => {
          allData = data;

          loadCategory(data);
          // console.log("data: ", data);
          renderTable(data);
        });

      fetch(
        "https://script.google.com/macros/s/AKfycbw077XQVpvfFv9nr8A-pf7gHpSjfA_Xj9i8yOs28MFa2eq8uIeknkpBc4QKbmKouwWYIQ/exec?action=message",
      )
        .then((res) => res.json())
        .then((data) => {
          messageTemplate = data;
          // console.log("MessageTemplate: ", data);
        });

      function loadCategory(data) {
        const ddl = document.getElementById("categoryFilter");

        const categories = [...new Set(data.map((x) => x.category))];

        categories.sort();

        categories.forEach((cat) => {
          ddl.innerHTML += `<option value="${cat}">
                ${cat}
             </option>`;
        });
      }

      function renderTable(data) {
        let html = "";

        currentData = data;
        // console.log("rendertabel: ", currentData);

        data.forEach((item, index) => {
          html += `
            <tr>
                <td>${item.name}</td>
                <td>${item.category}</td>
                <td>${item.no_wa}</td>
                <td>
                  <button onclick="sendWa(${index})">
                    Kirim WA
                  </button>
                </td>
            </tr>
        `;
        });

        document.getElementById("tblData").innerHTML = html;
      }

      document
        .getElementById("categoryFilter")
        .addEventListener("change", function () {
          const category = this.value;

          if (category === "") {
            renderTable(allData);
            return;
          }

          const filtered = allData.filter((x) => x.category === category);

          renderTable(filtered);
        });

      function sendWa(index) {
        const person = currentData[index];

        const message = `
      ${messageTemplate.greeting}
      Bismillahirrahmanirrahim.

      Kepada Yth.
      Bapak/Ibu/Saudara/i
      ${person.name}

      ${messageTemplate.opening}

      ${messageTemplate.from}

      ${messageTemplate.detail}
      ${messageTemplate.link}

      ${messageTemplate.hope}

      ${messageTemplate.closing}
      Wassalamualaikum warahmatullahi wabarakatuh.

      ${messageTemplate.best_regards}
      ${messageTemplate.from} 
      `;

        const no_whatsapps = person.no_wa.replace(/^0/, "62");
        const url = `https://wa.me/${no_whatsapps}?text=${encodeURIComponent(message)}`;

        window.open(url, "_blank");
      }
    </script>
  </body>
</html>
